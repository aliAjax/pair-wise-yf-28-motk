<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>临床试验随机化 · 号段托管</title>
<style>
:root{--ink:#1b2333;--muted:#6b7280;--line:#e2e6ee;--bg:#f5f7fb;--card:#fff;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--info:#0891b2}
*{box-sizing:border-box}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{background:#0f172a;color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:18px;margin:0;font-weight:600}
header .spacer{flex:1}
select,input,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.danger{background:var(--err);border-color:var(--err)}
button.small{padding:4px 9px;font-size:13px}
button:disabled{opacity:.55;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:9px 16px}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:12px}
.grid.cols2{grid-template-columns:1fr 1fr}
.grid.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.grid.cols2,.grid.cols3{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f8fafc;font-weight:600;color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.badge.ok{background:#dcfce7;color:var(--ok)}
.badge.warn{background:#fef3c7;color:var(--warn)}
.badge.err{background:#fee2e2;color:var(--err)}
.badge.info{background:#cffafe;color:var(--info)}
.badge.muted{background:#e5e7eb;color:var(--muted)}
pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;font-size:13px}
.muted{color:var(--muted)}
.numbers{display:flex;flex-wrap:wrap;gap:4px}
.numbers .n{padding:3px 7px;border-radius:5px;font-size:12px;font-family:ui-monospace,monospace;border:1px solid var(--line)}
.numbers .n.written{background:#dcfce7;color:var(--ok);border-color:#bbf7d0}
.numbers .n.reserved{background:#fef3c7;color:var(--warn);border-color:#fde68a}
.numbers .n.available{background:#e5e7eb;color:var(--muted)}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
#toast{position:fixed;bottom:20px;right:20px;padding:12px 16px;border-radius:8px;color:#fff;z-index:50;display:none;max-width:360px}
#toast.err{background:var(--err)}
#toast.ok{background:var(--ok)}
.diff{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>临床试验随机化 · 号段托管</h1>
  <div class="spacer"></div>
  <label class="muted" style="color:#cbd5e1">用户</label>
  <select id="user">
    <option value="site1">site1 · 中心一</option>
    <option value="site2">site2 · 中心二</option>
    <option value="coord">coord · 协调员</option>
    <option value="monitor1">monitor1 · 监查员</option>
    <option value="monitor2">monitor2 · 监查员</option>
  </select>
  <label class="muted" style="color:#cbd5e1">试验</label>
  <input id="trial" value="1" style="width:80px">
  <button onclick="loadAll()">刷新</button>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-tab="summary" class="active">概览</button>
    <button data-tab="segments">号段</button>
    <button data-tab="writeoff">核销</button>
    <button data-tab="batches">上传批次</button>
    <button data-tab="sites">中心</button>
    <button data-tab="audit">审计</button>
  </div>
  <div id="content"></div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const state={trial:null,factors:[],arms:[]};
const api=async(path,opts={})=>{
  const r=await fetch(path,{headers:{'Content-Type':'application/json','X-User-Id':$('#user').value},...opts});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data?.error?.message||('HTTP '+r.status));
  return data;
};
const toast=(msg,ok=false)=>{const t=$('#toast');t.textContent=msg;t.className=ok?'ok':'err';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
const badge=(s)=>{const m={active:'info',released:'muted',completed:'ok',partial:'warn',failed:'err',pending:'warn',processing:'info',written_off:'ok',enrolled:'info',withdrawn:'muted',approved:'ok',pending_req:'warn'}[s]||'muted';return `<span class="badge ${m}">${esc(s)}</span>`};
const factorsInputs=(prefix,vals={})=>state.factors.map(f=>`<div class="field"><label>${esc(f)}</label><input data-f="${esc(f)}" value="${esc(vals[f]||'')}" placeholder="请输入 ${esc(f)}"></div>`).join('');
const collectFactors=root=>{const o={};root.querySelectorAll('[data-f]').forEach(i=>o[i.dataset.f]=i.value.trim());return o};

async function loadTrial(){
  const id=$('#trial').value;
  const s=await api(`/api/trials/${id}/summary`);
  state.trial=s.trial;state.factors=s.trial.strata_factors||[];state.arms=s.trial.arms||[];
  return s;
}
async function loadAll(){
  try{await loadTrial();renderTab($('#tabs .active').dataset.tab)}
  catch(e){toast(e.message)}
}
$('#user').addEventListener('change',()=>renderTab($('#tabs .active').dataset.tab));
$('#tabs').addEventListener('click',e=>{if(e.target.dataset.tab){document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');renderTab(e.target.dataset.tab)}});

async function renderTab(tab){
  const c=$('#content');c.innerHTML='<p class="muted">加载中…</p>';
  try{
    if(tab==='summary'){const s=await loadTrial();c.innerHTML=viewSummary(s)}
    else if(tab==='segments'){await loadTrial();const items=await api(`/api/trials/${$('#trial').value}/segments`);c.innerHTML=viewSegments(items.items)}
    else if(tab==='writeoff'){await loadTrial();c.innerHTML=viewWriteoff()}
    else if(tab==='batches'){await loadTrial();const items=await api(`/api/trials/${$('#trial').value}/upload-batches`);c.innerHTML=viewBatches(items.items)}
    else if(tab==='sites'){await loadTrial();const items=await api('/api/sites');c.innerHTML=viewSites(items.items)}
    else if(tab==='audit'){await loadTrial();const a=await api(`/api/trials/${$('#trial').value}/audit`);c.innerHTML=viewAudit(a.items)}
  }catch(e){c.innerHTML=`<p class="muted">加载失败：${esc(e.message)}</p>`}
}

function viewSummary(s){
  const rows=s.by_site.map(r=>`<tr><td>${esc(r.site_id)}</td><td>${r.count}</td></tr>`).join('')||'<tr><td colspan="2" class="muted">暂无</td></tr>';
  return `<div class="card"><h2>试验概览</h2>
    <div class="grid cols3">
      <div class="stat"><div class="v">${esc(s.trial.name)}</div><div class="l">${esc(s.trial.protocol_version)} · ${badge(s.trial.status)}</div></div>
      <div class="stat"><div class="v">${s.participants_visible}</div><div class="l">可见入组数</div></div>
      <div class="stat"><div class="v">${s.by_site.length}</div><div class="l">中心数</div></div>
    </div>
    <h2 style="margin-top:16px">分中心入组</h2><table><thead><tr><th>中心</th><th>入组数</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="margin-top:10px">试验组：${state.arms.map(esc).join(' / ')}；分层因素：${state.factors.map(esc).join('、')||'（无）'}</p>
    </div>`;
}

function viewSegments(items){
  const isCoord=$('#user').value==='coord';
  const rows=items.map(s=>{
    const diff=s.total_count-s.written_off_count-s.unused_count-s.released_count;
    return `<tr>
      <td>#${s.id}</td><td>${esc(s.site_id)}</td>
      <td class="muted" style="font-family:monospace">${esc(s.stratum_key)}</td>
      <td>${s.start_no}–${s.end_no}</td>
      <td>${badge(s.status)}</td>
      <td>${s.written_off_count} / ${s.total_count}</td>
      <td>${s.unused_count}</td>
      <td>${s.released_count}</td>
      <td><button class="small ghost" onclick="showSegment(${s.id})">明细</button>
      ${isCoord&&s.status==='active'?`<button class="small danger" onclick="releaseSegment(${s.id})">释放</button>`:''}</td>
    </tr>`}).join('')||'<tr><td colspan="9" class="muted">暂无号段</td></tr>';
  return `<div class="card"><h2>号段列表</h2>
    <table><thead><tr><th>号段</th><th>中心</th><th>分层</th><th>编号区间</th><th>状态</th><th>已核销/总数</th><th>未用</th><th>已释放</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>
    ${isCoord?`<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <h2>预领号段（协调员）</h2>
      <div class="grid cols3">
        <div class="field"><label>中心</label><select id="seg_site">${['S001','S002'].map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div class="field"><label>数量</label><input id="seg_count" type="number" value="20" min="1" max="10000"></div>
      </div>
      <div id="seg_factors">${factorsInputs()}</div>
      <div class="field"><label>备注</label><input id="seg_note" placeholder="可选"></div>
      <button onclick="createSegment()">预占连续号段</button>
    </div>`:''}</div>`;
}

async function createSegment(){
  const body={site_id:$('#seg_site').value,count:+$('#seg_count').value,note:$('#seg_note').value,factors:collectFactors($('#seg_factors'))};
  try{const s=await api(`/api/trials/${$('#trial').value}/segments`,{method:'POST',body:JSON.stringify(body)});toast(`已预占号段 #${s.id}：${s.start_no}–${s.end_no}`);renderTab('segments')}
  catch(e){toast(e.message)}
}
async function releaseSegment(id){
  if(!confirm('确认释放该号段的未用名额？已核销编号不回收。'))return;
  try{const s=await api(`/api/segments/${id}/release`,{method:'POST',body:JSON.stringify({confirm:true})});toast(`已释放，回收 ${s.released_count} 个未用名额`,true);renderTab('segments')}
  catch(e){toast(e.message)}
}
async function showSegment(id){
  try{const s=await api(`/api/segments/${id}`);
    const nums=s.numbers.map(n=>`<span class="n ${n.status}" title="${n.external_id||''}">${String(n.seq_no).padStart(4,'0')}</span>`).join('');
    const html=`<div class="card"><h2>号段 #${s.id} 明细 · ${esc(s.site_id)} · ${badge(s.status)}</h2>
      <div class="grid cols3">
        <div class="stat"><div class="v">${s.total_count}</div><div class="l">总数</div></div>
        <div class="stat"><div class="v">${s.written_off_count}</div><div class="l">已核销</div></div>
        <div class="stat"><div class="v">${s.unused_count}</div><div class="l">未核销（差异）</div></div>
      </div>
      <div class="diff">差异说明：应核销 ${s.total_count} − 已核销 ${s.written_off_count} = 未核销 ${s.unused_count}；已释放 ${s.released_count}。同一外部编号只核销一次，已核销编号不回收。</div>
      <h2 style="margin-top:14px">编号清单（${s.start_no}–${s.end_no}）</h2>
      <div class="numbers">${nums}</div>
      <p class="muted" style="margin-top:10px">点击编号可看外部编号；绿色=已核销，黄色=未用，灰色=已释放。</p>
      <button class="ghost" onclick="renderTab('segments')">返回号段列表</button>
      </div>`;
    $('#content').innerHTML=html;
  }catch(e){toast(e.message)}
}

function viewWriteoff(){
  return `<div class="grid cols2">
    <div class="card"><h2>单笔核销</h2>
      <div class="field"><label>号段 ID</label><input id="wo_seg" placeholder="如 1"></div>
      <div class="field"><label>外部受试者编号</label><input id="wo_ext" placeholder="如 S001-001"></div>
      <div id="wo_factors">${factorsInputs()}</div>
      <button onclick="writeOff()">核销并入组</button>
      <p class="muted" style="margin-top:8px">同一外部编号只核销一次；重复提交幂等返回。</p>
    </div>
    <div class="card"><h2>批量离线核销（上传清单）</h2>
      <div class="field"><label>号段 ID（本中心预领的号段）</label><input id="batch_seg" placeholder="如 1"></div>
      <div class="field"><label>分层因素（与号段一致）</label><div id="batch_factors">${factorsInputs()}</div></div>
      <div class="field"><label>外部编号清单（每行一个）</label><textarea id="batch_items" rows="8" placeholder="S001-001&#10;S001-002&#10;S001-003"></textarea></div>
      <div class="field"><label>备注</label><input id="batch_note" placeholder="可选"></div>
      <button onclick="createBatch()">上传并核销</button>
      <p class="muted" style="margin-top:8px">上传失败保留原号段并支持重试；清单持久化，重启后可继续传。</p>
    </div>
  </div>`;
}
async function writeOff(){
  const seg=$('#wo_seg').value.trim();const ext=$('#wo_ext').value.trim();
  if(!seg||!ext)return toast('请填写号段 ID 和外部编号');
  try{const p=await api(`/api/segments/${seg}/write-off`,{method:'POST',body:JSON.stringify({external_id:ext,factors:collectFactors($('#wo_factors'))})});toast(`已核销：${p.allocation_code}`,true);renderTab('writeoff')}
  catch(e){toast(e.message)}
}
async function createBatch(){
  const seg=$('#batch_seg').value.trim();const factors=collectFactors($('#batch_factors'));
  const exts=$('#batch_items').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!seg)return toast('请填写号段 ID');if(!exts.length)return toast('请填写外部编号清单');
  const items=exts.map(e=>({external_id:e,factors}));
  try{const b=await api(`/api/trials/${$('#trial').value}/upload-batches`,{method:'POST',body:JSON.stringify({items,segment_id:+seg,note:$('#batch_note').value})});
    toast(`批次 #${b.id}：已核销 ${b.processed_count}/${b.total_count}${b.status==='completed'?'，全部完成':'，可继续重试'}`);
    renderTab('batches');
  }catch(e){toast(e.message)}
}

function viewBatches(items){
  const rows=items.map(b=>{
    const failed=b.items.filter(i=>i.status==='failed').length;
    return `<tr><td>#${b.id}</td><td>${esc(b.site_id)}</td><td>${b.total_count}</td><td>${b.processed_count}</td>
      <td>${badge(b.status)}</td><td>${failed}</td>
      <td><button class="small ghost" onclick="showBatch(${b.id})">明细</button>
      ${['pending','partial','failed'].includes(b.status)?`<button class="small" onclick="processBatch(${b.id})">继续/重试</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">暂无批次</td></tr>';
  return `<div class="card"><h2>上传批次</h2>
    <table><thead><tr><th>批次</th><th>中心</th><th>总数</th><th>已核销</th><th>状态</th><th>失败</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function processBatch(id){
  try{const b=await api(`/api/upload-batches/${id}/process`,{method:'POST'});toast(`批次 #${b.id}：已核销 ${b.processed_count}/${b.total_count}`,b.status==='completed');renderTab('batches')}
  catch(e){toast(e.message)}
}
async function showBatch(id){
  try{const b=await api(`/api/upload-batches/${id}`);
    const rows=b.items.map(i=>`<tr><td>${esc(i.external_id)}</td><td>${badge(i.status)}</td><td>${i.participant_id||'–'}</td><td class="muted">${esc(i.error||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无</td></tr>';
    const html=`<div class="card"><h2>批次 #${b.id} 明细 · ${esc(b.site_id)} · ${badge(b.status)}</h2>
      <div class="grid cols3">
        <div class="stat"><div class="v">${b.total_count}</div><div class="l">总数</div></div>
        <div class="stat"><div class="v">${b.processed_count}</div><div class="l">已核销</div></div>
        <div class="stat"><div class="v">${b.total_count-b.processed_count}</div><div class="l">待核销（差异）</div></div>
      </div>
      <h2 style="margin-top:14px">清单项</h2>
      <table><thead><tr><th>外部编号</th><th>状态</th><th>受试者 ID</th><th>失败原因</th></tr></thead><tbody>${rows}</tbody></table>
      ${['pending','partial','failed'].includes(b.status)?`<button onclick="processBatch(${b.id})">继续/重试</button>`:''}
      <button class="ghost" onclick="renderTab('batches')">返回批次列表</button></div>`;
    $('#content').innerHTML=html;
  }catch(e){toast(e.message)}
}

function viewSites(items){
  const isCoord=$('#user').value==='coord';
  const rows=items.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${s.active?badge('active'):badge('failed')}</td>
    <td class="muted">${s.deactivated_at||'–'}</td>
    <td>${isCoord?(s.active?`<button class="small danger" onclick="deactivateSite('${s.id}')">停用</button>`:`<button class="small" onclick="activateSite('${s.id}')">启用</button>`):''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">暂无</td></tr>';
  return `<div class="card"><h2>中心管理</h2>
    <table><thead><tr><th>中心</th><th>名称</th><th>状态</th><th>停用时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="margin-top:10px">停用中心时释放其未用号段；已发编号和审计记录保留可查。</p></div>`;
}
async function deactivateSite(id){
  if(!confirm(`确认停用中心 ${id}？未用号段将被释放，已发编号不回收。`))return;
  try{const r=await api(`/api/sites/${id}/deactivate`,{method:'POST'});toast(`已停用，释放 ${r.released_numbers} 个未用名额`,true);renderTab('sites')}catch(e){toast(e.message)}
}
async function activateSite(id){
  try{await api(`/api/sites/${id}/activate`,{method:'POST'});toast('已启用',true);renderTab('sites')}catch(e){toast(e.message)}
}

function viewAudit(items){
  const rows=items.map(a=>`<tr><td class="muted" style="white-space:nowrap">${esc(a.created_at)}</td><td>${esc(a.actor_id)}</td><td>${esc(a.action)}</td><td class="muted">${esc(JSON.stringify(a.detail))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">暂无审计</td></tr>';
  return `<div class="card"><h2>审计记录</h2><table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>详情</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

loadAll();
</script>
</body>
</html>
